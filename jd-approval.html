<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B4A5C">
<title>JD Approval | Tychiff Solutions</title><link rel="icon" type="image/png" href="favicon.png"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="acc-body"><div class="acc-top container"><a class="brand" href="index.html"><img class="logo" src="logo.png" alt="Tychiff Solutions"></a><span class="role-badge">Client approval</span></div>
<main class="container" style="max-width:820px;padding:40px 0 80px"><div id="root"></div></main>
<script src="jd.js"></script><script>
const id=location.hash.slice(1),j=id&&jdGet(id),R=document.getElementById('root'),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
if(!j){R.innerHTML='<div class="panel"><h3>JD not found</h3><p>This approval link is not valid in this browser. Ask your Tychiff recruiter to resend it.</p></div>'}else draw();
function draw(){const done=j.status==='Approved';
 R.innerHTML=`<div class="panel"><span class="tag ${done?'g':j.status==='Changes requested'?'r':'a'}">${j.status}</span> <span class="tag">Version ${j.version}</span><h1 style="font-size:1.9rem;margin:12px 0 4px">${esc(j.title)}</h1><p>${esc(j.company)} · ${j.id} · prepared by Tychiff Solutions</p></div>`+
 JD_ORDER.filter(k=>j.sections[k]).map(k=>`<div class="panel"><h3>${k}</h3><div style="white-space:pre-wrap;color:var(--ink);font-size:.95rem">${esc(j.sections[k])}</div></div>`).join('')+
 (done?`<div class="insight">✓ <div><b>Approved by ${esc(j.client.name)} (${esc(j.client.desig)})</b><small>Tychiff will now start sourcing.</small></div></div>`:j.status==='Draft'?'<div class="panel"><p>This JD has not been shared yet.</p></div>':
 `<div class="panel"><h3>Your response</h3><div class="form-grid"><label>Your name *<input id="cn"></label><label>Designation *<input id="cd"></label><label class="full">Comments (required if you request changes)<textarea id="cc" rows="4" placeholder="Tell us what to change"></textarea></label></div><div class="err" id="er"></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="act(true)">Approve JD</button><button class="btn nav-login" onclick="act(false)">Request changes</button><button class="btn nav-login" onclick="print()">Print</button></div></div>`)}
function act(ok){const n=cn.value.trim(),d=cd.value.trim(),c=cc.value.trim();if(!n||!d){er.textContent='Enter your name and designation.';return}if(!ok&&!c){er.textContent='Please describe the changes you need.';return}
 j.status=ok?'Approved':'Changes requested';j.client={name:n,desig:d,comment:c};j.history.push({t:new Date().toLocaleString(),what:ok?'Approved by '+n:'Changes requested by '+n});jdPut(j);draw()}
</script><script>if(getComputedStyle(document.body).backgroundColor==='rgba(0, 0, 0, 0)'){document.body.insertAdjacentHTML('afterbegin','<div style="background:#fff3cd;color:#664d03;padding:12px 16px;font:14px sans-serif;border-bottom:1px solid #ffe69c">This page cannot find its design files. Unzip the whole tychiff-site folder and open the page from inside it.</div>')}</script></body></html>
